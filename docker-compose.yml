# Local development stack: PostgreSQL 16 with pgvector + the Linkdine AI API.
# The Next.js frontend runs separately with `npm run dev` (it is deployed to Vercel in production).
#
#   docker compose up --build
#
# Optional settings can be placed in a .env file next to this file (never commit it).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: linkdine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkdine_dev_password}
      POSTGRES_DB: linkdine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkdine -d linkdine"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://linkdine:${POSTGRES_PASSWORD:-linkdine_dev_password}@db:5432/linkdine
      VECTOR_STORE: pgvector
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-to-a-long-random-string-32chars}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mock-linkdine-v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
